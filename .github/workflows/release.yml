name: release

# Push a branch named releases/vMAJOR.MINOR.PATCH to release that version:
# test, build linux/darwin x amd64/arm64 with GoReleaser into a draft GitHub
# release, then tag the commit and publish the release.
on:
  push:
    branches:
      - "releases/v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version from branch name
        id: version
        run: |
          version="${GITHUB_REF_NAME#releases/}"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::branch '$GITHUB_REF_NAME' must be named releases/vMAJOR.MINOR.PATCH"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null; then
            echo "::error::tag $version already exists; cut a new version instead"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      # GoReleaser takes the version from a tag on HEAD. The tag stays local
      # until the release is built.
      - name: Tag locally
        run: git tag "${{ steps.version.outputs.version }}"

      - name: Build and create draft release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tag
        run: git push origin "refs/tags/${{ steps.version.outputs.version }}"

      - name: Publish release
        run: gh release edit "${{ steps.version.outputs.version }}" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
